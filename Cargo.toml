[workspace]
members = ["programs/*", "client"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-client = { version = "1.0.0" }
anchor-gen = "0.3.1"
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.0" }
spl-associated-token-account = "8.0.0"
anyhow = "1"
arrayref = "0.3.7"
bincode = "1.3.3"
bs58 = { version = "0.5.0" }
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
clap = { version = "3", features = ["derive", "env"] }
colorful = "0.2.2"
configparser = "3.0.0"
criterion = "0.5"
dotenv = "0.15.0"
glob = "0.3.1"
hex = "0.4.3"
itertools = "0.11.0"
jupiter-amm-interface = { version = ">=1.0.0-beta.0, <2" }
once_cell = "1"
peace-lock = "0.1"
proptest = "1.0"
quickcheck = "0.9"
rand = "0.8.5"
referral = { git = "https://github.com/jup-ag/gfx-referral.git", rev = "92fb6619db63ece740ca79b50a591dc79f6b3f30", features = [
    "cpi",
    "mainnet",
] }
regex = "1"
rust_decimal = { version = "1.36.0", features = ["maths", "c-repr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder = "4.1.2"
solana-account = "4.3.0"
solana-client = "4.1.2"
solana-clock = "3.0.1"
solana-commitment-config = "3.1.1"
solana-keypair = "3.0.1"
solana-message = "4.2.4"
solana-program = "4.0.0"
solana-program-runtime = "4.1.2"
solana-program-pack = "3.1.0"
solana-program-test = "4.1.2"
solana-pubkey = "4.2.0"
solana-security-txt = "1.1.1"
solana-signature = "3.1.0"
solana-signer = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-system-interface = { version = "2.0.0", features = ["bincode"] }
solana-transaction = "4.1.5"
solana-transaction-status-client-types = "4.1.2"
spl-math = { version = "0.3.0", features = ["no-entrypoint"] }
spl-memo-interface = "2.0.0"
spl-token-interface = "2.0.0"
spl-token-2022-interface = "2.1.0"
static_init = "1.0.3"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uint = "0.9.1"
url = "2"
zstd = "0.12"
ahash = "0.8.11"


base64 = "0.21.0"
# solana-bpf-simulator = { git = "https://github.com/dovahcrow/solana-bpf-simulator" }

gamma = { path = "programs/gamma", features = ["no-entrypoint"] }
fixed = "=1.28.0"
fixed-macro = "1.1"
