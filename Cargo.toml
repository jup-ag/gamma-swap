[workspace]
members = ["programs/*", "client"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-client = { version = "0.31.1" }
anchor-gen = "0.3.1"
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
spl-associated-token-account = "7.0.0"
anyhow = "1"
arrayref = "0.3.7"
bincode = "1.3.3"
bs58 = { version = "0.5.0" }
bytemuck = { version = "1.4.0", features = ["derive", "min_const_generics"] }
clap = { version = "3", features = ["derive", "env"] }
colorful = "0.2.2"
configparser = "3.0.0"
criterion = "0.5"
dotenv = "0.15.0"
glob = "0.3.1"
hex = "0.4.3"
itertools = "0.11.0"
jupiter-amm-interface = "0.6"
once_cell = "1"
peace-lock = "0.1"
proptest = "1.0"
quickcheck = "0.9"
rand = "0.8.5"
referral = { git = "https://github.com/jup-ag/gfx-referral.git", rev = "643f26c5a2db899d3c1eb54a5a09d302149f7ccb", features = [
    "cpi",
    "mainnet",
] }
regex = "1"
rust_decimal = { version = "1.36.0", features = ["maths", "c-repr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder = ">=2.2"
solana-client = ">=2.2"
solana-program = ">=2.2"
solana-program-runtime = ">=2.2"
solana-program-test = ">=2.2"
solana-sdk = ">=2.2"
solana-security-txt = "1.1.1"
solana-transaction-status = ">=2.2"
spl-math = { version = "0.3.0", features = ["no-entrypoint"] }
spl-memo = "6.0.0"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }
spl-token-client = "0.14.0"
static_init = "1.0.3"
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
uint = "0.9.1"
url = "2"
zstd = "0.12"
ahash = "0.8.11"


base64 = "0.21.0"
# solana-bpf-simulator = { git = "https://github.com/dovahcrow/solana-bpf-simulator" }

gamma = { path = "programs/gamma", features = ["no-entrypoint"] }
fixed = "=1.28.0"
fixed-macro = "1.1"

